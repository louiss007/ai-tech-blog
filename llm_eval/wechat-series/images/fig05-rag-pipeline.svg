<svg xmlns="http://www.w3.org/2000/svg" width="750" height="580" viewBox="0 0 750 580">
  <rect width="750" height="580" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <g font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
    <text x="375" y="48" text-anchor="middle" font-size="28" font-weight="700" fill="#0f172a">RAG 评估要拆开看</text>
    <text x="375" y="78" text-anchor="middle" font-size="16" fill="#64748b">先看找没找到，再看用没用好</text>

    <rect x="40" y="112" width="100" height="32" rx="16" fill="#dbeafe"/>
    <text x="90" y="133" text-anchor="middle" font-size="14" fill="#1d4ed8">检索阶段</text>

    <rect x="40" y="165" width="120" height="64" rx="9" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="100" y="204" text-anchor="middle" font-size="15" font-weight="600" fill="#1e3a8a">解析</text>

    <rect x="178" y="165" width="120" height="64" rx="9" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="238" y="204" text-anchor="middle" font-size="15" font-weight="600" fill="#1e3a8a">切分</text>

    <rect x="316" y="165" width="120" height="64" rx="9" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="376" y="204" text-anchor="middle" font-size="15" font-weight="600" fill="#1e3a8a">Embedding</text>

    <rect x="454" y="165" width="120" height="64" rx="9" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="514" y="204" text-anchor="middle" font-size="15" font-weight="600" fill="#1e3a8a">向量检索</text>

    <rect x="592" y="165" width="120" height="64" rx="9" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="652" y="204" text-anchor="middle" font-size="15" font-weight="600" fill="#1e3a8a">重排</text>

    <line x1="162" y1="197" x2="174" y2="197" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="300" y1="197" x2="312" y2="197" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="438" y1="197" x2="450" y2="197" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="576" y1="197" x2="588" y2="197" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="40" y="245" width="672" height="42" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="56" y="271" font-size="13" fill="#475569">Recall@k  ·  Precision@k  ·  MRR  ·  NDCG  ·  Chunk Hit Rate</text>

    <line x1="40" y1="312" x2="712" y2="312" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="5 5"/>

    <rect x="40" y="330" width="100" height="32" rx="16" fill="#fef3c7"/>
    <text x="90" y="351" text-anchor="middle" font-size="14" fill="#b45309">生成阶段</text>

    <rect x="75" y="383" width="180" height="64" rx="9" fill="#fffbeb" stroke="#fcd34d"/>
    <text x="165" y="422" text-anchor="middle" font-size="17" font-weight="600" fill="#92400e">上下文拼接</text>

    <rect x="270" y="383" width="180" height="64" rx="9" fill="#fffbeb" stroke="#fcd34d"/>
    <text x="360" y="422" text-anchor="middle" font-size="17" font-weight="600" fill="#92400e">LLM 生成</text>

    <rect x="465" y="383" width="180" height="64" rx="9" fill="#fffbeb" stroke="#fcd34d"/>
    <text x="555" y="422" text-anchor="middle" font-size="17" font-weight="600" fill="#92400e">答案与引用</text>

    <line x1="257" y1="415" x2="266" y2="415" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="452" y1="415" x2="461" y2="415" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="75" y="463" width="570" height="42" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="91" y="489" font-size="13" fill="#475569">Faithfulness  ·  Citation  ·  Correctness  ·  Utilization</text>

    <text x="375" y="550" text-anchor="middle" font-size="15" fill="#64748b">检索错了，生成再强也救不回来。</text>
  </g>
</svg>
