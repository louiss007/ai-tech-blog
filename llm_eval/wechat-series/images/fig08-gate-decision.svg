<svg xmlns="http://www.w3.org/2000/svg" width="750" height="600" viewBox="0 0 750 600">
  <rect width="750" height="600" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <g font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
    <text x="375" y="48" text-anchor="middle" font-size="28" font-weight="700" fill="#0f172a">上线门禁怎么判</text>
    <text x="375" y="78" text-anchor="middle" font-size="16" fill="#64748b">硬指标一票否决，软指标评审放行</text>

    <rect x="275" y="110" width="200" height="54" rx="12" fill="#0f172a"/>
    <text x="375" y="144" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">候选版本</text>

    <line x1="375" y1="166" x2="375" y2="188" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="100" y="190" width="550" height="70" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="125" y="233" font-size="20" font-weight="700" fill="#991b1b">硬门禁</text>
    <text x="245" y="233" font-size="15" fill="#334155">安全 / Schema / 高危</text>
    <rect x="505" y="208" width="120" height="34" rx="17" fill="#fee2e2"/>
    <text x="565" y="230" text-anchor="middle" font-size="13" fill="#b91c1c">不达标 → 阻断</text>

    <line x1="375" y1="262" x2="375" y2="278" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="100" y="280" width="550" height="70" rx="10" fill="#fffbeb" stroke="#fcd34d"/>
    <text x="125" y="323" font-size="20" font-weight="700" fill="#92400e">回归门禁</text>
    <text x="245" y="323" font-size="15" fill="#334155">对比基线，显著退化</text>
    <rect x="505" y="298" width="120" height="34" rx="17" fill="#fef3c7"/>
    <text x="565" y="320" text-anchor="middle" font-size="13" fill="#b45309">退化 → 拦截</text>

    <line x1="375" y1="352" x2="375" y2="368" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="100" y="370" width="550" height="70" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="125" y="413" font-size="20" font-weight="700" fill="#1e3a8a">成本门禁</text>
    <text x="245" y="413" font-size="15" fill="#334155">P95 / 单成功成本</text>
    <rect x="505" y="388" width="120" height="34" rx="17" fill="#dbeafe"/>
    <text x="565" y="410" text-anchor="middle" font-size="13" fill="#1d4ed8">超预算 → 评审</text>

    <line x1="375" y1="442" x2="375" y2="478" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="225" y="480" width="300" height="60" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="375" y="517" text-anchor="middle" font-size="18" font-weight="700" fill="#166534">灰度发布 → 线上监控</text>

    <text x="375" y="575" text-anchor="middle" font-size="15" fill="#64748b">门禁不是打分，是决策。</text>
  </g>
</svg>
