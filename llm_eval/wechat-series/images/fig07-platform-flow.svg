<svg xmlns="http://www.w3.org/2000/svg" width="750" height="700" viewBox="0 0 750 700">
  <rect width="750" height="700" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
  </defs>
  <g font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
    <text x="375" y="48" text-anchor="middle" font-size="28" font-weight="700" fill="#0f172a">评估平台的数据流</text>
    <text x="375" y="78" text-anchor="middle" font-size="16" fill="#64748b">从评估集到上线门禁，再回到评估集</text>

    <rect x="110" y="110" width="460" height="64" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="135" y="148" font-size="14" fill="#64748b">01</text>
    <text x="175" y="146" font-size="18" font-weight="700" fill="#1e3a8a">评估集 + 版本</text>
    <text x="175" y="168" font-size="13" fill="#64748b">分层、冻结、可追溯</text>

    <rect x="110" y="196" width="460" height="64" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="135" y="234" font-size="14" fill="#64748b">02</text>
    <text x="175" y="232" font-size="18" font-weight="700" fill="#1e3a8a">批量运行</text>
    <text x="175" y="254" font-size="13" fill="#64748b">模型 / Prompt / 索引快照</text>

    <rect x="110" y="282" width="460" height="64" rx="10" fill="#f0fdfa" stroke="#99f6e4"/>
    <text x="135" y="320" font-size="14" fill="#64748b">03</text>
    <text x="175" y="318" font-size="18" font-weight="700" fill="#115e59">规则指标</text>
    <text x="175" y="340" font-size="13" fill="#64748b">格式、长度、检索、成本</text>

    <rect x="110" y="368" width="460" height="64" rx="10" fill="#f0fdfa" stroke="#99f6e4"/>
    <text x="135" y="406" font-size="14" fill="#64748b">04</text>
    <text x="175" y="404" font-size="18" font-weight="700" fill="#115e59">Judge + 人工抽检</text>
    <text x="175" y="426" font-size="13" fill="#64748b">语义评分、高风险复核</text>

    <rect x="110" y="454" width="460" height="64" rx="10" fill="#fffbeb" stroke="#fcd34d"/>
    <text x="135" y="492" font-size="14" fill="#64748b">05</text>
    <text x="175" y="490" font-size="18" font-weight="700" fill="#92400e">报告 + 门禁</text>
    <text x="175" y="512" font-size="13" fill="#64748b">失败案例、硬软门禁</text>

    <rect x="110" y="540" width="460" height="64" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="135" y="578" font-size="14" fill="#64748b">06</text>
    <text x="175" y="576" font-size="18" font-weight="700" fill="#0f172a">线上监控 + 回流</text>
    <text x="175" y="598" font-size="13" fill="#64748b">抽样评估、失败回流</text>

    <line x1="340" y1="176" x2="340" y2="192" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="340" y1="262" x2="340" y2="278" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="340" y1="348" x2="340" y2="364" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="340" y1="434" x2="340" y2="450" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="340" y1="520" x2="340" y2="536" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

    <path d="M110,604 L80,604 L80,112 L108,112" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-orange)"/>
    <text x="375" y="656" text-anchor="middle" font-size="13" fill="#b45309">失败样本回流，更新评估集</text>
  </g>
</svg>
