<svg xmlns="http://www.w3.org/2000/svg" width="750" height="560" viewBox="0 0 750 560">
  <rect width="750" height="560" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
  </defs>
  <g font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
    <text x="375" y="48" text-anchor="middle" font-size="28" font-weight="700" fill="#0f172a">Agent 评估：结果 + 过程</text>
    <text x="375" y="78" text-anchor="middle" font-size="16" fill="#64748b">一条 Trace，既看做了什么，也看怎么做的</text>

    <rect x="40" y="120" width="120" height="64" rx="9" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="100" y="159" text-anchor="middle" font-size="15" font-weight="600" fill="#1e3a8a">目标</text>

    <rect x="178" y="120" width="120" height="64" rx="9" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="238" y="159" text-anchor="middle" font-size="15" font-weight="600" fill="#1e3a8a">规划</text>

    <rect x="316" y="120" width="120" height="64" rx="9" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="376" y="159" text-anchor="middle" font-size="15" font-weight="600" fill="#1e3a8a">工具调用</text>

    <rect x="454" y="120" width="120" height="64" rx="9" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="514" y="159" text-anchor="middle" font-size="15" font-weight="600" fill="#1e3a8a">观察</text>

    <rect x="592" y="120" width="120" height="64" rx="9" fill="#0f172a"/>
    <text x="652" y="159" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">最终交付</text>

    <line x1="162" y1="152" x2="174" y2="152" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="300" y1="152" x2="312" y2="152" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="438" y1="152" x2="450" y2="152" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="576" y1="152" x2="588" y2="152" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

    <path d="M514,186 L514,218 L376,218 L376,190" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-orange)"/>
    <text x="445" y="238" text-anchor="middle" font-size="13" fill="#b45309">调整 / 重试</text>

    <rect x="40" y="270" width="320" height="210" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="65" y="306" font-size="20" font-weight="700" fill="#1e3a8a">看结果</text>
    <text x="65" y="347" font-size="15" fill="#334155">Task Success Rate</text>
    <text x="65" y="383" font-size="15" fill="#334155">Final Answer Quality</text>
    <text x="65" y="419" font-size="15" fill="#334155">Safety Violation</text>
    <text x="65" y="455" font-size="15" fill="#334155">Cost per Success</text>

    <rect x="390" y="270" width="320" height="210" rx="12" fill="#f0fdfa" stroke="#99f6e4"/>
    <text x="415" y="306" font-size="20" font-weight="700" fill="#115e59">看过程</text>
    <text x="415" y="347" font-size="15" fill="#334155">Tool Selection</text>
    <text x="415" y="383" font-size="15" fill="#334155">Step Efficiency</text>
    <text x="415" y="419" font-size="15" fill="#334155">Loop Rate</text>
    <text x="415" y="455" font-size="15" fill="#334155">Trace Completeness</text>

    <text x="375" y="525" text-anchor="middle" font-size="15" fill="#64748b">结果对但过程不安全，仍不算高质量成功。</text>
  </g>
</svg>
