<svg xmlns="http://www.w3.org/2000/svg" width="750" height="560" viewBox="0 0 750 560">
  <rect width="750" height="560" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <g font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
    <text x="375" y="48" text-anchor="middle" font-size="28" font-weight="700" fill="#0f172a">评估的四层对象</text>
    <text x="375" y="78" text-anchor="middle" font-size="16" fill="#64748b">越往下越接近真实价值，也越难自动化</text>

    <rect x="60" y="110" width="630" height="82" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <rect x="60" y="110" width="8" height="82" rx="4" fill="#2563eb"/>
    <text x="90" y="145" font-size="22" font-weight="700" fill="#1e3a8a">模型层</text>
    <text x="230" y="146" font-size="17" fill="#334155">它具备哪些能力？</text>
    <text x="90" y="173" font-size="15" fill="#64748b">基础能力与短板</text>
    <rect x="490" y="128" width="180" height="34" rx="17" fill="#dbeafe"/>
    <text x="580" y="150" text-anchor="middle" font-size="14" fill="#1d4ed8">公开 Benchmark</text>

    <line x1="375" y1="194" x2="375" y2="208" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="60" y="212" width="630" height="82" rx="10" fill="#f0fdfa" stroke="#99f6e4"/>
    <rect x="60" y="212" width="8" height="82" rx="4" fill="#0f766e"/>
    <text x="90" y="247" font-size="22" font-weight="700" fill="#115e59">任务层</text>
    <text x="230" y="248" font-size="17" fill="#334155">单个任务输出好不好？</text>
    <text x="90" y="275" font-size="15" fill="#64748b">具体任务效果</text>
    <rect x="520" y="230" width="150" height="34" rx="17" fill="#ccfbf1"/>
    <text x="595" y="252" text-anchor="middle" font-size="14" fill="#0f766e">Golden Set</text>

    <line x1="375" y1="296" x2="375" y2="310" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="60" y="314" width="630" height="82" rx="10" fill="#fffbeb" stroke="#fcd34d"/>
    <rect x="60" y="314" width="8" height="82" rx="4" fill="#d97706"/>
    <text x="90" y="349" font-size="22" font-weight="700" fill="#92400e">系统层</text>
    <text x="230" y="350" font-size="17" fill="#334155">整条链路效果如何？</text>
    <text x="90" y="377" font-size="15" fill="#64748b">Prompt + RAG + Agent</text>
    <rect x="500" y="332" width="170" height="34" rx="17" fill="#fef3c7"/>
    <text x="585" y="354" text-anchor="middle" font-size="14" fill="#b45309">端到端 + Trace</text>

    <line x1="375" y1="398" x2="375" y2="412" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="60" y="416" width="630" height="82" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <rect x="60" y="416" width="8" height="82" rx="4" fill="#0f172a"/>
    <text x="90" y="451" font-size="22" font-weight="700" fill="#0f172a">业务层</text>
    <text x="230" y="452" font-size="17" fill="#334155">用户是否真的受益？</text>
    <text x="90" y="479" font-size="15" fill="#64748b">真实用户与结果</text>
    <rect x="500" y="434" width="170" height="34" rx="17" fill="#e2e8f0"/>
    <text x="585" y="456" text-anchor="middle" font-size="14" fill="#334155">线上实验 + 工单</text>

    <text x="375" y="538" text-anchor="middle" font-size="15" fill="#64748b">模型看能力，应用看效果，业务看价值。</text>
  </g>
</svg>
