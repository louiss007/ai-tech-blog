<svg xmlns="http://www.w3.org/2000/svg" width="750" height="400" viewBox="0 0 750 400">
  <rect width="750" height="400" fill="#ffffff"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
  <g font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
    <text x="375" y="46" font-size="28" fill="#0f172a" font-weight="700" text-anchor="middle">RLVR 落地三阶段</text>
    <text x="375" y="76" font-size="15" fill="#64748b" font-weight="400" text-anchor="middle">先建验证器，再跑小闭环，最后扩规模</text>
<rect x="30" y="120" width="210" height="200" rx="14" fill="#eff6ff" stroke="#bfdbfe"/><rect x="30" y="120" width="210" height="8" rx="4" fill="#2563eb" stroke="#2563eb"/><text x="50" y="160" font-size="19" fill="#1e3a8a" font-weight="700" text-anchor="start">阶段一 验证器</text><text x="50" y="186" font-size="14" fill="#2563eb" font-weight="600" text-anchor="start">产出：可信验证器</text><circle cx="56" cy="220" r="4" fill="#2563eb"/><text x="70" y="226" font-size="15" fill="#334155" font-weight="400" text-anchor="start">选可验证任务</text><circle cx="56" cy="250" r="4" fill="#2563eb"/><text x="70" y="256" font-size="15" fill="#334155" font-weight="400" text-anchor="start">建审核集</text><circle cx="56" cy="280" r="4" fill="#2563eb"/><text x="70" y="286" font-size="15" fill="#334155" font-weight="400" text-anchor="start">搭安全沙箱</text><rect x="270" y="100" width="210" height="220" rx="14" fill="#f0fdfa" stroke="#99f6e4"/><rect x="270" y="100" width="210" height="8" rx="4" fill="#0f766e" stroke="#0f766e"/><text x="290" y="140" font-size="19" fill="#115e59" font-weight="700" text-anchor="start">阶段二 小闭环</text><text x="290" y="166" font-size="14" fill="#0f766e" font-weight="600" text-anchor="start">产出：可复现闭环</text><circle cx="296" cy="200" r="4" fill="#0f766e"/><text x="310" y="206" font-size="15" fill="#334155" font-weight="400" text-anchor="start">小模型试点</text><circle cx="296" cy="230" r="4" fill="#0f766e"/><text x="310" y="236" font-size="15" fill="#334155" font-weight="400" text-anchor="start">采样与奖励</text><circle cx="296" cy="260" r="4" fill="#0f766e"/><text x="310" y="266" font-size="15" fill="#334155" font-weight="400" text-anchor="start">评估与回滚</text><rect x="510" y="80" width="210" height="240" rx="14" fill="#f5f3ff" stroke="#c4b5fd"/><rect x="510" y="80" width="210" height="8" rx="4" fill="#7c3aed" stroke="#7c3aed"/><text x="530" y="120" font-size="19" fill="#5b21b6" font-weight="700" text-anchor="start">阶段三 规模化</text><text x="530" y="146" font-size="14" fill="#7c3aed" font-weight="600" text-anchor="start">产出：稳定收益</text><circle cx="536" cy="180" r="4" fill="#7c3aed"/><text x="550" y="186" font-size="15" fill="#334155" font-weight="400" text-anchor="start">多验证器</text><circle cx="536" cy="210" r="4" fill="#7c3aed"/><text x="550" y="216" font-size="15" fill="#334155" font-weight="400" text-anchor="start">红队测试</text><circle cx="536" cy="240" r="4" fill="#7c3aed"/><text x="550" y="246" font-size="15" fill="#334155" font-weight="400" text-anchor="start">成本与容量</text><line x1="240" y1="350" x2="266" y2="330" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/><line x1="480" y1="330" x2="506" y2="290" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)"/>    <text x="375" y="380" font-size="14" fill="#64748b" font-weight="400" text-anchor="middle">不要跳过验证器直接上 RL；每一阶段都要能评估、能回滚。</text>
  </g>
</svg>

