xt x="465" y="320" font-size="13" fill="#64748b" font-weight="400" text-anchor="middle">权重 / 配置</text><rect x="210" y="270" width="150" height="64" rx="10" fill="#fffbeb" stroke="#fcd34d"/><text x="285" y="298" font-size="19" fill="#92400e" font-weight="700" text-anchor="middle">评估</text><text x="285" y="320" font-size="13" fill="#64748b" font-weight="400" text-anchor="middle">pass@k / 安全</text><rect x="30" y="270" width="150" height="64" rx="10" fill="#fffbeb" stroke="#fcd34d"/><text x="105" y="298" font-size="19" fill="#92400e" font-weight="700" text-anchor="middle">部署候选</text><text x="105" y="320" font-size="13" fill="#64748b" font-weight="400" text-anchor="middle">灰度 / 回滚</text><line x1="645" y1="174" x2="645" y2="264" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/><line x1="570" y1="302" x2="546" y2="302" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)"/><line x1="390" y1="302" x2="366" y2="302" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)"/><line x1="210" y1="302" x2="186" y2="302" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="382" width="330" height="46" rx="10" fill="#f8fafc" stroke="#e2e8f0"/><text x="195" y="410" font-size="15" fill="#334155" font-weight="600" text-anchor="middle">Experiment Tracker：配置 / 指标 / 血缘</text><rect x="380" y="382" width="340" height="46" rx="10" fill="#fffbeb" stroke="#fcd34d"/><text x="550" y="410" font-size="15" fill="#92400e" font-weight="600" text-anchor="middle">Safety Sandbox：隔离 / 限权 / 审计</text>    <text x="375" y="470" font-size="14" fill="#64748b" font-weight="400" text-anchor="middle">验证器与沙箱是两套独立的安全边界，不能互相替代。</text>
