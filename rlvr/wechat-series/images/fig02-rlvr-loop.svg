    <text x="375" y="76" font-size="15" fill="#64748b" font-weight="400" text-anchor="middle">模型负责提出候选，验证器负责判断候选</text>
<rect x="29" y="118" width="116" height="78" rx="12" fill="#eff6ff" stroke="#bfdbfe"/><text x="87.0" y="152" font-size="20" fill="#1e3a8a" font-weight="700" text-anchor="middle">问题</text><text x="87.0" y="177" font-size="14" fill="#64748b" font-weight="400" text-anchor="middle">prompt</text><line x1="147" y1="157.0" x2="171" y2="157.0" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/><rect x="173" y="118" width="116" height="78" rx="12" fill="#eff6ff" stroke="#bfdbfe"/><text x="231.0" y="152" font-size="20" fill="#1e3a8a" font-weight="700" text-anchor="middle">采样</text><text x="231.0" y="177" font-size="14" fill="#64748b" font-weight="400" text-anchor="middle">N 个回答</text><line x1="291" y1="157.0" x2="315" y2="157.0" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/><rect x="317" y="118" width="116" height="78" rx="12" fill="#f0fdfa" stroke="#99f6e4"/><text x="375.0" y="152" font-size="20" fill="#115e59" font-weight="700" text-anchor="middle">Verifier</text><text x="375.0" y="177" font-size="14" fill="#64748b" font-weight="400" text-anchor="middle">规则 / 测试</text><line x1="435" y1="157.0" x2="459" y2="157.0" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/><rect x="461" y="118" width="116" height="78" rx="12" fill="#fffbeb" stroke="#fcd34d"/><text x="519.0" y="152" font-size="20" fill="#92400e" font-weight="700" text-anchor="middle">奖励</text><text x="519.0" y="177" font-size="14" fill="#64748b" font-weight="400" text-anchor="middle">0 / 1 / 分级</text><line x1="579" y1="157.0" x2="603" y2="157.0" stroke="#d97706" stroke-width="2" marker-end="url(#arrow)"/><rect x="605" y="118" width="116" height="78" rx="12" fill="#f5f3ff" stroke="#c4b5fd"/><text x="663.0" y="152" font-size="20" fill="#5b21b6" font-weight="700" text-anchor="middle">更新</text><text x="663.0" y="177" font-size="14" fill="#64748b" font-weight="400" text-anchor="middle">策略梯度</text><polyline points="663,196 663,300 231,300 231,202" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-purple)"/><text x="447" y="326" font-size="14" fill="#7c3aed" font-weight="600" text-anchor="middle">下一轮采样</text><rect x="218" y="342" width="96" height="32" rx="16" fill="#eff6ff" stroke="#bfdbfe"/><text x="266" y="364" font-size="14" fill="#1e3a8a" font-weight="600" text-anchor="middle">多探索</text><rect x="326" y="342" width="96" height="32" rx="16" fill="#f0fdfa" stroke="#99f6e4"/><text x="374" y="364" font-size="14" fill="#115e59" font-weight="600" text-anchor="middle">可靠筛选</text><rect x="434" y="342" width="96" height="32" rx="16" fill="#fffbeb" stroke="#fcd34d"/><text x="482" y="364" font-size="14" fill="#92400e" font-weight="600" text-anchor="middle">KL 约束</text>    <text x="375" y="402" font-size="14" fill="#64748b" font-weight="400" text-anchor="middle">多采样提高命中率，验证器提供对比信号，KL 防止策略漂移。</text>
