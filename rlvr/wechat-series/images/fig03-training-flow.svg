<svg xmlns="http://www.w3.org/2000/svg" width="750" height="570" viewBox="0 0 750 570">
  <rect width="750" height="570" fill="#ffffff"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
  <g font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
    <text x="375" y="46" font-size="28" fill="#0f172a" font-weight="700" text-anchor="middle">RLVR 的七步训练流程</text>
    <text x="375" y="76" font-size="15" fill="#64748b" font-weight="400" text-anchor="middle">从数据到 checkpoint，每一步都要可追踪</text>
<rect x="60" y="104" width="630" height="48" rx="10" fill="#eff6ff" stroke="#bfdbfe"/><circle cx="86" cy="128" r="14" fill="#2563eb"/><text x="86" y="133" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><text x="112" y="134" font-size="19" fill="#1e3a8a" font-weight="700" text-anchor="start">数据准备</text><text x="664" y="134" font-size="14" fill="#334155" font-weight="400" text-anchor="end">题目、答案、测试、规则</text><line x1="86" y1="152" x2="86" y2="162" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="164" width="630" height="48" rx="10" fill="#eff6ff" stroke="#bfdbfe"/><circle cx="86" cy="188" r="14" fill="#2563eb"/><text x="86" y="193" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><text x="112" y="194" font-size="19" fill="#1e3a8a" font-weight="700" text-anchor="start">Rollout</text><text x="664" y="194" font-size="14" fill="#334155" font-weight="400" text-anchor="end">同一问题采样 N 次，记录 logprob</text><line x1="86" y1="212" x2="86" y2="222" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="224" width="630" height="48" rx="10" fill="#f0fdfa" stroke="#99f6e4"/><circle cx="86" cy="248" r="14" fill="#0f766e"/><text x="86" y="253" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><text x="112" y="254" font-size="19" fill="#115e59" font-weight="700" text-anchor="start">Verifier</text><text x="664" y="254" font-size="14" fill="#334155" font-weight="400" text-anchor="end">格式、答案、执行、符号、模型辅助</text><line x1="86" y1="272" x2="86" y2="282" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="284" width="630" height="48" rx="10" fill="#f0fdfa" stroke="#99f6e4"/><circle cx="86" cy="308" r="14" fill="#0f766e"/><text x="86" y="313" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><text x="112" y="314" font-size="19" fill="#115e59" font-weight="700" text-anchor="start">Reward</text><text x="664" y="314" font-size="14" fill="#334155" font-weight="400" text-anchor="end">正确性 + 格式 + 过程 - 惩罚 - KL</text><line x1="86" y1="332" x2="86" y2="342" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="344" width="630" height="48" rx="10" fill="#f5f3ff" stroke="#c4b5fd"/><circle cx="86" cy="368" r="14" fill="#7c3aed"/><text x="86" y="373" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="112" y="374" font-size="19" fill="#5b21b6" font-weight="700" text-anchor="start">RL 优化</text><text x="664" y="374" font-size="14" fill="#334155" font-weight="400" text-anchor="end">PPO / GRPO / REINFORCE</text><line x1="86" y1="392" x2="86" y2="402" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="404" width="630" height="48" rx="10" fill="#fffbeb" stroke="#fcd34d"/><circle cx="86" cy="428" r="14" fill="#d97706"/><text x="86" y="433" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">6</text><text x="112" y="434" font-size="19" fill="#92400e" font-weight="700" text-anchor="start">评估</text><text x="664" y="434" font-size="14" fill="#334155" font-weight="400" text-anchor="end">pass@1、pass@k、安全回归</text><line x1="86" y1="452" x2="86" y2="462" stroke="#d97706" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="464" width="630" height="48" rx="10" fill="#fffbeb" stroke="#fcd34d"/><circle cx="86" cy="488" r="14" fill="#d97706"/><text x="86" y="493" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">7</text><text x="112" y="494" font-size="19" fill="#92400e" font-weight="700" text-anchor="start">Checkpoint</text><text x="664" y="494" font-size="14" fill="#334155" font-weight="400" text-anchor="end">版本、配置、数据、验证器</text>    <text x="375" y="544" font-size="14" fill="#64748b" font-weight="400" text-anchor="middle">数据、验证器和模型版本必须一起记录，否则奖励无法重放。</text>
  </g>
</svg>

