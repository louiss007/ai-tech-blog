<svg xmlns="http://www.w3.org/2000/svg" width="750" height="470" viewBox="0 0 750 470">
  <rect width="750" height="470" fill="#ffffff"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
  <g font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
    <text x="375" y="46" font-size="28" fill="#0f172a" font-weight="700" text-anchor="middle">Verifier 的四层漏斗</text>
    <text x="375" y="76" font-size="15" fill="#64748b" font-weight="400" text-anchor="middle">便宜的先跑，昂贵的兜底</text>
<rect x="70" y="110" width="610" height="62" rx="10" fill="#eff6ff" stroke="#bfdbfe"/><rect x="70" y="110" width="7" height="62" rx="4" fill="#2563eb" stroke="#2563eb"/><text x="94" y="137" font-size="19" fill="#1e3a8a" font-weight="700" text-anchor="start">格式与结构</text><text x="94" y="160" font-size="14" fill="#334155" font-weight="400" text-anchor="start">正则 / JSON Schema / 解析器</text><text x="664" y="148" font-size="13" fill="#2563eb" font-weight="600" text-anchor="end">快、便宜</text><rect x="120" y="188" width="510" height="62" rx="10" fill="#f0fdfa" stroke="#99f6e4"/><rect x="120" y="188" width="7" height="62" rx="4" fill="#0f766e" stroke="#0f766e"/><text x="144" y="215" font-size="19" fill="#115e59" font-weight="700" text-anchor="start">答案等价 / 执行</text><text x="144" y="238" font-size="14" fill="#334155" font-weight="400" text-anchor="start">数值比较 / 符号计算 / 单元测试</text><text x="614" y="226" font-size="13" fill="#0f766e" font-weight="600" text-anchor="end">中等成本</text><rect x="170" y="266" width="410" height="62" rx="10" fill="#f5f3ff" stroke="#c4b5fd"/><rect x="170" y="266" width="7" height="62" rx="4" fill="#7c3aed" stroke="#7c3aed"/><text x="194" y="293" font-size="19" fill="#5b21b6" font-weight="700" text-anchor="start">符号 / 形式化</text><text x="194" y="316" font-size="14" fill="#334155" font-weight="400" text-anchor="start">CAS / SMT / 证明助手</text><text x="564" y="304" font-size="13" fill="#7c3aed" font-weight="600" text-anchor="end">高置信</text><rect x="220" y="344" width="310" height="62" rx="10" fill="#fffbeb" stroke="#fcd34d"/><rect x="220" y="344" width="7" height="62" rx="4" fill="#d97706" stroke="#d97706"/><text x="244" y="371" font-size="19" fill="#92400e" font-weight="700" text-anchor="start">模型裁判 / 人工</text><text x="244" y="394" font-size="14" fill="#334155" font-weight="400" text-anchor="start">长尾、歧义、抽检</text><text x="514" y="382" font-size="13" fill="#d97706" font-weight="600" text-anchor="end">最贵</text><text x="28" y="140" font-size="14" fill="#64748b" font-weight="400" text-anchor="middle">成本</text><line x1="28" y1="158" x2="28" y2="390" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-orange)"/>    <text x="375" y="444" font-size="14" fill="#64748b" font-weight="400" text-anchor="middle">越往下成本越高；形式化层置信度最高，模型裁判用于长尾。</text>
  </g>
</svg>

