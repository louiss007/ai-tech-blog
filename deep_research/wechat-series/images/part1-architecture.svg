<svg xmlns="http://www.w3.org/2000/svg" width="750" height="1500" viewBox="0 0 750 1500">
  <rect width="750" height="1500" fill="#ffffff"/>

  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="375" y="46" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#0f172a">Deep Research 七个核心模块</text>
  <text x="375" y="80" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="17" fill="#64748b">不是串行流水线，而是“规划 — 执行 — 验证”的研究闭环</text>

  <!-- 输入 -->
  <rect x="235" y="110" width="280" height="50" rx="25" fill="#0f172a"/>
  <text x="375" y="142" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="20" font-weight="600" fill="#ffffff">用户研究问题</text>
  <line x1="375" y1="160" x2="375" y2="186" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

  <!-- 01 问题理解 -->
  <rect x="80" y="190" width="590" height="100" rx="14" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
  <rect x="100" y="204" width="44" height="24" rx="12" fill="#2563eb"/>
  <text x="122" y="221" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="13" font-weight="700" fill="#ffffff">01</text>
  <text x="100" y="256" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="27" font-weight="700" fill="#0f172a">问题理解</text>
  <text x="100" y="282" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="20" fill="#475569">意图识别 · 约束提取 · 歧义澄清 · 成功标准</text>
  <line x1="375" y1="290" x2="375" y2="318" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="390" y="309" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="14" fill="#64748b">研究简报</text>

  <!-- 02 任务规划 -->
  <rect x="80" y="320" width="590" height="100" rx="14" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
  <rect x="100" y="334" width="44" height="24" rx="12" fill="#2563eb"/>
  <text x="122" y="351" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="13" font-weight="700" fill="#ffffff">02</text>
  <text x="100" y="386" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="27" font-weight="700" fill="#0f172a">任务规划</text>
  <text x="100" y="412" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="20" fill="#475569">子问题 DAG · 优先级 · 预算分配 · 停止条件</text>
  <line x1="375" y1="420" x2="375" y2="448" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="390" y="439" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="14" fill="#64748b">研究计划 / 子问题 DAG</text>

  <!-- 执行循环 -->
  <rect x="55" y="450" width="640" height="520" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="75" y="481" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#334155">执行循环（可多轮）</text>

  <!-- 03 信息检索 -->
  <rect x="85" y="500" width="580" height="110" rx="12" fill="#ffffff" stroke="#dbeafe" stroke-width="1.5"/>
  <rect x="104" y="513" width="44" height="23" rx="11.5" fill="#2563eb"/>
  <text x="126" y="529" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.5" font-weight="700" fill="#ffffff">03</text>
  <text x="104" y="558" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="26" font-weight="700" fill="#0f172a">信息检索</text>
  <text x="104" y="585" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="19" fill="#475569">Web · 向量 · BM25 · 混合召回 · 查询改写</text>
  <line x1="375" y1="610" x2="375" y2="638" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

  <!-- 04 阅读抽取 -->
  <rect x="85" y="640" width="580" height="110" rx="12" fill="#ffffff" stroke="#dbeafe" stroke-width="1.5"/>
  <rect x="104" y="653" width="44" height="23" rx="11.5" fill="#2563eb"/>
  <text x="126" y="669" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.5" font-weight="700" fill="#ffffff">04</text>
  <text x="104" y="698" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="26" font-weight="700" fill="#0f172a">阅读抽取</text>
  <text x="104" y="725" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="19" fill="#475569">解析 · 切片 · claim + quote · 引用定位</text>
  <line x1="375" y1="750" x2="375" y2="778" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

  <!-- 05 可信度验证 -->
  <rect x="85" y="780" width="580" height="110" rx="12" fill="#ffffff" stroke="#dbeafe" stroke-width="1.5"/>
  <rect x="104" y="793" width="44" height="23" rx="11.5" fill="#2563eb"/>
  <text x="126" y="809" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.5" font-weight="700" fill="#ffffff">05</text>
  <text x="104" y="838" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="26" font-weight="700" fill="#0f172a">可信度验证</text>
  <text x="104" y="865" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="19" fill="#475569">来源分级 · 交叉验证 · 时效 · 冲突处理</text>

  <!-- 反馈回路 -->
  <path d="M 375 890 L 375 925 Q 375 935 365 935 L 130 935 Q 120 935 120 925 L 120 614" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <text x="375" y="961" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="15" fill="#b45309">信息缺口 / 证据冲突 → 追加检索</text>

  <!-- 重规划虚线 -->
  <line x1="620" y1="450" x2="620" y2="424" stroke="#d97706" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#arrow-orange)"/>
  <text x="628" y="441" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="13" fill="#b45309">重规划</text>

  <!-- 06 推理综合 -->
  <line x1="375" y1="970" x2="375" y2="998" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <rect x="80" y="1000" width="590" height="100" rx="14" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
  <rect x="100" y="1014" width="44" height="24" rx="12" fill="#2563eb"/>
  <text x="122" y="1031" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="13" font-weight="700" fill="#ffffff">06</text>
  <text x="100" y="1066" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="27" font-weight="700" fill="#0f172a">推理综合</text>
  <text x="100" y="1092" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="20" fill="#475569">证据图 · 多跳推理 · 比较 / 归因 / 外推</text>
  <line x1="375" y1="1100" x2="375" y2="1128" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="390" y="1119" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="14" fill="#64748b">中间结论 + 置信度</text>

  <!-- 07 报告生成 -->
  <rect x="80" y="1130" width="590" height="110" rx="14" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
  <rect x="100" y="1144" width="44" height="24" rx="12" fill="#2563eb"/>
  <text x="122" y="1161" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="13" font-weight="700" fill="#ffffff">07</text>
  <text x="100" y="1198" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="27" font-weight="700" fill="#0f172a">报告生成</text>
  <text x="100" y="1224" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="20" fill="#475569">大纲 · 逐章写作 · 引用绑定 · 风险与建议</text>
  <line x1="375" y1="1240" x2="375" y2="1266" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

  <!-- 输出 -->
  <rect x="265" y="1268" width="220" height="46" rx="23" fill="#0f766e"/>
  <text x="375" y="1297" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="19" font-weight="600" fill="#ffffff">研究报告 + 引用</text>

  <!-- 贯穿全程的状态与证据 -->
  <rect x="80" y="1345" width="590" height="86" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="100" y="1378" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#0f172a">贯穿全程：研究状态 + 证据库</text>
  <text x="100" y="1408" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="15" fill="#475569">计划 · 证据 · 覆盖率 · 冲突 · 预算 · Trace</text>

  <!-- 图例 -->
  <line x1="230" y1="1465" x2="268" y2="1465" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="278" y="1470" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="14" fill="#475569">主流程</text>
  <line x1="420" y1="1465" x2="458" y2="1465" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrow-orange)"/>
  <text x="468" y="1470" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="14" fill="#475569">反馈 / 追加检索</text>
</svg>
