<svg xmlns="http://www.w3.org/2000/svg" width="750" height="700" viewBox="0 0 750 700">
  <rect width="750" height="700" fill="#ffffff"/>
  <defs>
    <marker id="a-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2563eb"/>
    </marker>
    <marker id="a-orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d97706"/>
    </marker>
  </defs>
  <g font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
    <text x="375" y="46" text-anchor="middle" font-size="29" font-weight="700" fill="#0f172a">Agent 的核心运行闭环</text>
    <text x="375" y="78" text-anchor="middle" font-size="16" fill="#64748b">目标 → 规划 → 行动 → 观察 → 更新 → 反思，直到完成或终止</text>

    <!-- Row 1 -->
    <rect x="45" y="120" width="180" height="64" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="135" y="148" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">目标理解</text>
    <text x="135" y="169" text-anchor="middle" font-size="11" fill="#64748b">意图 · 约束 · 验收标准</text>

    <rect x="285" y="120" width="180" height="64" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="375" y="148" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">任务规划</text>
    <text x="375" y="169" text-anchor="middle" font-size="11" fill="#64748b">子任务 · 依赖 · 完成判据</text>

    <rect x="525" y="120" width="180" height="64" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="615" y="148" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">工具选择</text>
    <text x="615" y="169" text-anchor="middle" font-size="11" fill="#64748b">候选过滤 · 参数生成</text>

    <line x1="225" y1="152" x2="283" y2="152" stroke="#2563eb" stroke-width="2.4" marker-end="url(#a-blue)"/>
    <line x1="465" y1="152" x2="523" y2="152" stroke="#2563eb" stroke-width="2.4" marker-end="url(#a-blue)"/>
    <line x1="615" y1="184" x2="615" y2="294" stroke="#2563eb" stroke-width="2.4" marker-end="url(#a-blue)"/>

    <!-- Row 2 -->
    <rect x="525" y="296" width="180" height="64" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <text x="615" y="324" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">工具调用</text>
    <text x="615" y="345" text-anchor="middle" font-size="11" fill="#64748b">校验 · 执行 · 超时重试</text>

    <rect x="285" y="296" width="180" height="64" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="375" y="324" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">观察结果</text>
    <text x="375" y="345" text-anchor="middle" font-size="11" fill="#64748b">解析 · 校验 · 错误分类</text>

    <rect x="45" y="296" width="180" height="64" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="135" y="324" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">状态更新</text>
    <text x="135" y="345" text-anchor="middle" font-size="11" fill="#64748b">计划进度 · 事实 · 缺口</text>

    <line x1="525" y1="328" x2="467" y2="328" stroke="#2563eb" stroke-width="2.4" marker-end="url(#a-blue)"/>
    <line x1="285" y1="328" x2="227" y2="328" stroke="#2563eb" stroke-width="2.4" marker-end="url(#a-blue)"/>
    <line x1="135" y1="360" x2="135" y2="464" stroke="#2563eb" stroke-width="2.4" marker-end="url(#a-blue)"/>

    <!-- State box -->
    <rect x="255" y="404" width="240" height="44" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
    <text x="375" y="422" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">Agent State · 贯穿全程</text>
    <text x="375" y="439" text-anchor="middle" font-size="11" fill="#a16207">目标 · 计划 · 事实 · 预算 · Trace</text>

    <!-- Row 3 -->
    <rect x="45" y="466" width="180" height="64" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="135" y="494" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">反思校验</text>
    <text x="135" y="515" text-anchor="middle" font-size="11" fill="#64748b">一致性 · 缺口 · 冲突</text>

    <rect x="285" y="466" width="180" height="64" rx="12" fill="#0f766e"/>
    <text x="375" y="494" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">最终结果</text>
    <text x="375" y="515" text-anchor="middle" font-size="11" fill="#ccfbf1">带来源 · 带不确定性</text>

    <line x1="225" y1="498" x2="283" y2="498" stroke="#0f766e" stroke-width="2.4" marker-end="url(#a-blue)"/>
    <text x="254" y="488" text-anchor="middle" font-size="10" fill="#0f766e">判据满足</text>

    <!-- Replan feedback -->
    <path d="M 45 498 L 16 498 L 16 98 L 375 98 L 375 118" fill="none" stroke="#d97706" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#a-orange)"/>
    <text x="392" y="94" font-size="13" fill="#b45309">计划失败 / 信息缺口 → 重规划</text>

    <!-- Bottom note -->
    <rect x="45" y="576" width="660" height="60" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="375" y="602" text-anchor="middle" font-size="14" fill="#334155">循环的每一轮都应该更新状态，而不是把全部历史重复塞回上下文</text>
    <text x="375" y="623" text-anchor="middle" font-size="13" fill="#64748b">终止条件：目标达成 · 达到步数 / 预算上限 · 连续无进展 · 人工取消</text>

    <!-- Legend -->
    <line x1="270" y1="672" x2="306" y2="672" stroke="#2563eb" stroke-width="2.4" marker-end="url(#a-blue)"/>
    <text x="316" y="677" font-size="13" fill="#475569">主流程</text>
    <line x1="420" y1="672" x2="456" y2="672" stroke="#d97706" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#a-orange)"/>
    <text x="466" y="677" font-size="13" fill="#475569">反馈 / 重规划</text>
  </g>
</svg>
