<svg xmlns="http://www.w3.org/2000/svg" width="750" height="640" viewBox="0 0 750 640">
  <rect width="750" height="640" fill="#ffffff"/>
  <defs>
    <marker id="a-dark" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#334155"/>
    </marker>
    <marker id="a-orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d97706"/>
    </marker>
  </defs>
  <g font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
    <text x="375" y="46" text-anchor="middle" font-size="29" font-weight="700" fill="#0f172a">从 Chatbot 到 Agent：能力边界的扩展</text>
    <text x="375" y="78" text-anchor="middle" font-size="16" fill="#64748b">问答 → 知识增强 → 目标驱动的行动闭环</text>

    <!-- Panel 1: Chatbot -->
    <rect x="35" y="110" width="210" height="58" rx="12" fill="#64748b"/>
    <text x="140" y="140" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">Chatbot</text>
    <text x="140" y="157" text-anchor="middle" font-size="11" fill="#e2e8f0">被动问答</text>
    <rect x="35" y="168" width="210" height="382" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

    <rect x="65" y="188" width="150" height="36" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="140" y="211" text-anchor="middle" font-size="13" fill="#334155">用户问题</text>
    <line x1="140" y1="224" x2="140" y2="234" stroke="#334155" stroke-width="1.6" marker-end="url(#a-dark)"/>
    <rect x="65" y="236" width="150" height="36" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="140" y="259" text-anchor="middle" font-size="13" fill="#334155">LLM 生成</text>
    <line x1="140" y1="272" x2="140" y2="282" stroke="#334155" stroke-width="1.6" marker-end="url(#a-dark)"/>
    <rect x="65" y="284" width="150" height="36" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="140" y="307" text-anchor="middle" font-size="13" fill="#334155">文本回答</text>

    <text x="53" y="352" font-size="14" fill="#0f766e">✓</text>
    <text x="75" y="352" font-size="14" fill="#475569">语义理解与生成</text>
    <text x="53" y="382" font-size="14" fill="#0f766e">✓</text>
    <text x="75" y="382" font-size="14" fill="#475569">多轮对话</text>
    <text x="53" y="412" font-size="14" fill="#dc2626">✗</text>
    <text x="75" y="412" font-size="14" fill="#475569">任务规划</text>
    <text x="53" y="442" font-size="14" fill="#dc2626">✗</text>
    <text x="75" y="442" font-size="14" fill="#475569">工具调用</text>
    <text x="53" y="472" font-size="14" fill="#dc2626">✗</text>
    <text x="75" y="472" font-size="14" fill="#475569">执行闭环</text>

    <!-- Panel 2: RAG -->
    <rect x="270" y="110" width="210" height="58" rx="12" fill="#0f766e"/>
    <text x="375" y="140" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">RAG</text>
    <text x="375" y="157" text-anchor="middle" font-size="11" fill="#ccfbf1">知识增强</text>
    <rect x="270" y="168" width="210" height="382" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

    <rect x="300" y="188" width="150" height="36" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="375" y="211" text-anchor="middle" font-size="13" fill="#334155">用户问题</text>
    <line x1="375" y1="224" x2="375" y2="234" stroke="#334155" stroke-width="1.6" marker-end="url(#a-dark)"/>
    <rect x="300" y="236" width="150" height="36" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="375" y="259" text-anchor="middle" font-size="13" fill="#334155">检索外部知识</text>
    <line x1="375" y1="272" x2="375" y2="282" stroke="#334155" stroke-width="1.6" marker-end="url(#a-dark)"/>
    <rect x="300" y="284" width="150" height="36" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="375" y="307" text-anchor="middle" font-size="13" fill="#334155">LLM 生成（带引用）</text>

    <text x="288" y="352" font-size="14" fill="#0f766e">✓</text>
    <text x="310" y="352" font-size="14" fill="#475569">语义理解与生成</text>
    <text x="288" y="382" font-size="14" fill="#0f766e">✓</text>
    <text x="310" y="382" font-size="14" fill="#475569">外部知识检索</text>
    <text x="288" y="412" font-size="14" fill="#dc2626">✗</text>
    <text x="310" y="412" font-size="14" fill="#475569">任务规划</text>
    <text x="288" y="442" font-size="14" fill="#d97706">△</text>
    <text x="310" y="442" font-size="14" fill="#475569">仅检索类工具</text>
    <text x="288" y="472" font-size="14" fill="#dc2626">✗</text>
    <text x="310" y="472" font-size="14" fill="#475569">执行闭环</text>

    <!-- Panel 3: Agent -->
    <rect x="505" y="110" width="210" height="58" rx="12" fill="#2563eb"/>
    <text x="610" y="140" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">Agent</text>
    <text x="610" y="157" text-anchor="middle" font-size="11" fill="#dbeafe">目标驱动</text>
    <rect x="505" y="168" width="210" height="382" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>

    <rect x="535" y="188" width="150" height="36" rx="8" fill="#ffffff" stroke="#93c5fd"/>
    <text x="610" y="211" text-anchor="middle" font-size="13" fill="#1e3a8a">用户目标</text>
    <line x1="610" y1="224" x2="610" y2="234" stroke="#2563eb" stroke-width="1.6" marker-end="url(#a-dark)"/>
    <rect x="535" y="236" width="150" height="36" rx="8" fill="#ffffff" stroke="#93c5fd"/>
    <text x="610" y="259" text-anchor="middle" font-size="13" fill="#1e3a8a">规划 + 工具调用</text>
    <line x1="610" y1="272" x2="610" y2="282" stroke="#2563eb" stroke-width="1.6" marker-end="url(#a-dark)"/>
    <rect x="535" y="284" width="150" height="36" rx="8" fill="#ffffff" stroke="#93c5fd"/>
    <text x="610" y="307" text-anchor="middle" font-size="13" fill="#1e3a8a">观察并继续</text>
    <path d="M 685 302 L 700 302 L 700 254 L 688 254" fill="none" stroke="#d97706" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#a-orange)"/>

    <text x="523" y="352" font-size="14" fill="#0f766e">✓</text>
    <text x="545" y="352" font-size="14" fill="#475569">目标理解与规划</text>
    <text x="523" y="382" font-size="14" fill="#0f766e">✓</text>
    <text x="545" y="382" font-size="14" fill="#475569">工具选择与调用</text>
    <text x="523" y="412" font-size="14" fill="#0f766e">✓</text>
    <text x="545" y="412" font-size="14" fill="#475569">记忆与任务状态</text>
    <text x="523" y="442" font-size="14" fill="#0f766e">✓</text>
    <text x="545" y="442" font-size="14" fill="#475569">观察与反馈</text>
    <text x="523" y="472" font-size="14" fill="#0f766e">✓</text>
    <text x="545" y="472" font-size="14" fill="#475569">执行闭环</text>

    <!-- Bottom band -->
    <rect x="35" y="572" width="680" height="44" rx="22" fill="#0f172a"/>
    <text x="375" y="600" text-anchor="middle" font-size="15" fill="#ffffff">能力边界扩展：语言交互 → 知识增强 → 目标驱动的行动闭环</text>
  </g>
</svg>
